<!DOCTYPE html>
<html>
<head>
    <title>Train Ticket Booking System - Price Checker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f4;
        }
        .container {
            max-width: 800px;
            background: #fff;
            padding: 20px;
            border: 1px solid #ccc;
        }
        .form-group {
            margin-bottom: 15px;
            display: inline-block;
            margin-right: 20px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }
        select, button {
            padding: 8px;
            width: 200px;
        }
        button {
            background-color: #0056b3;
            color: white;
            border: none;
            cursor: pointer;
            width: 150px;
        }
        button:hover {
            background-color: #004494;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
        .cheapest-row {
            background-color: #d4edda !important;
            font-weight: bold;
            color: #155724;
        }
        #alert-box {
            padding: 15px;
            background-color: #d1ecf1;
            border: 1px solid #bee5eb;
            color: #0c5460;
            margin-top: 15px;
            display: none;
        }
        #error-box {
            padding: 15px;
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
            margin-top: 15px;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Train Ticket Price Checker & Comparison</h2>
    <hr>
    
    <form id="ticketForm">
        <div class="form-group">
            <label>From Station:</label>
            <select id="origin" required>
                <option value="">--Select Origin--</option>
                <option value="London">London</option>
                <option value="Manchester">Manchester</option>
                <option value="Birmingham">Birmingham</option>
                <option value="Liverpool">Liverpool</option>
            </select>
        </div>

        <div class="form-group">
            <label>To Station:</label>
            <select id="destination" required>
                <option value="">--Select Destination--</option>
                <option value="London">London</option>
                <option value="Manchester">Manchester</option>
                <option value="Birmingham">Birmingham</option>
                <option value="Liverpool">Liverpool</option>
            </select>
        </div>

        <div class="form-group">
            <button type="submit">Check Prices</button>
        </div>
    </form>

    <div id="alert-box"></div>
    <div id="error-box"></div>

    <table id="resultsTable" style="display: none;">
        <thead>
            <tr>
                <th>Train / Service Operator</th>
                <th>Route</th>
                <th>Travel Time</th>
                <th>Price (USD)</th>
            </tr>
        </thead>
        <tbody id="tableData">
            <!-- JS dynamic loop rows -->
        </tbody>
    </table>
</div>

<script src="script.js"></script>
</body>
</html>
